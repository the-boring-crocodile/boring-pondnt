# The one check: the same command as on a workstation (scripts/check.py).
name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      # Pond Common is built from the commit in .common-ref; its build is
      # reproducible, so the wheels match the hashes in requirements.lock.
      - id: common
        run: echo "ref=$(cat .common-ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ github.repository_owner }}/boring-pond-common
          ref: ${{ steps.common.outputs.ref }}
          path: .deps/boring-pond-common
      - run: python .deps/boring-pond-common/scripts/build.py --out .deps/common-dist
      - id: services
        run: echo "ref=$(cat .services-ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ github.repository_owner }}/boring-services
          ref: ${{ steps.services.outputs.ref }}
          path: .deps/boring-services
      # The browser tests drive Google Chrome. GitHub's Ubuntu 24.04 runners do not
      # allow its sandbox (user namespaces), so it aborts at start; the tests get a
      # wrapper without it. Tests only: d365web itself never launches Edge this way.
      - run: |
          printf '#!/bin/sh\nexec google-chrome --no-sandbox "$@"\n' > "$RUNNER_TEMP/chrome-nosandbox"
          chmod +x "$RUNNER_TEMP/chrome-nosandbox"
          echo "D365WEB_TEST_BROWSER=$RUNNER_TEMP/chrome-nosandbox" >> "$GITHUB_ENV"
      - run: python scripts/check.py --common-wheels .deps/common-dist --services-root .deps/boring-services
