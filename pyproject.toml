[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "boring-pondnt"
version = "0.2.0rc22"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "COPYING.md"]
description = "Local stdio MCP server for Copilot in Visual Studio on a rebuildable Windows dev VM"
requires-python = ">=3.10"
# boring-registry, boring-service-kit and boring-file-core come from Pond Common releases.
dependencies = [
    "mcp>=2.2,<2.3",
    "boring-sourcecache-d365>=0.1.15,<0.2",
    "boring-registry>=0.7.5,<0.8",
    "boring-service-kit[process]>=0.7.5,<0.8",
    "boring-file-core>=0.7.5,<0.8",
    "pyodbc>=5.3,<6; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
boring-pondnt-core = "boring_pondnt.server:main"
boring-pondnt-d365 = "boring_pondnt.d365_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
    "windows: needs real Windows (process trees, console encoding, locks)",
]
